<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 174" role="img" aria-label="Алгоритм балансера: пайплайн выбора реплики (пул LIVE ∪ PROBING → no-wait waiting=0 → least-loaded min running → pin session/prefix → affinity или load) и health-машина (EJECTED → 2× scrape OK → PROBING → 15 s → LIVE; eject при 5xx, stuck, scrape fail; EJECTED без user traffic, scrape продолжается)">
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">

    <!-- ── Routing pipeline ───────────────────────────────────────────── -->
    <text x="12" y="36" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">ROUTING</text>

    <g>
      <rect x="70" y="6" width="140" height="52" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
      <text x="84" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">POOL</text>
      <text x="84" y="46" font-size="14" font-weight="600" fill="#111111">LIVE ∪ PROBING</text>

      <rect x="234" y="6" width="140" height="52" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
      <text x="248" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">NO-WAIT</text>
      <text x="248" y="46" font-size="14" font-weight="600" fill="#111111">waiting = 0</text>

      <rect x="398" y="6" width="140" height="52" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
      <text x="412" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">LEAST-LOADED</text>
      <text x="412" y="46" font-size="14" font-weight="600" fill="#111111">min running</text>

      <rect x="562" y="6" width="140" height="52" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
      <text x="576" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">PIN</text>
      <text x="576" y="46" font-size="14" font-weight="600" fill="#111111">session → prefix</text>

      <rect x="726" y="6" width="140" height="52" rx="10" fill="#f5f5f5" stroke="#e5e7eb"/>
      <text x="740" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">RESULT</text>
      <text x="740" y="46" font-size="14" font-weight="600" fill="#111111">affinity | load</text>
    </g>

    <g stroke="#9ca3af" stroke-width="1.5">
      <line x1="214" y1="32" x2="228" y2="32" marker-end="url(#ah-gray)"/>
      <line x1="378" y1="32" x2="392" y2="32" marker-end="url(#ah-gray)"/>
      <line x1="542" y1="32" x2="556" y2="32" marker-end="url(#ah-gray)"/>
      <line x1="706" y1="32" x2="720" y2="32" marker-end="url(#ah-gray)"/>
    </g>

    <!-- ── Health state machine ───────────────────────────────────────── -->
    <text x="12" y="110" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10.5" font-weight="500" letter-spacing="0.08em" fill="#6b7280">HEALTH</text>

    <rect x="140" y="84" width="150" height="44" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <text x="215" y="111" font-size="14" font-weight="600" fill="#991b1b" text-anchor="middle">EJECTED</text>

    <rect x="370" y="84" width="150" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="445" y="111" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">PROBING</text>

    <rect x="600" y="84" width="150" height="44" rx="10" fill="#d1fae5" stroke="#34d399"/>
    <text x="675" y="111" font-size="14" font-weight="600" fill="#065f46" text-anchor="middle">LIVE</text>

    <line x1="290" y1="106" x2="364" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <text x="327" y="98" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6b7280" text-anchor="middle">2× scrape OK</text>

    <line x1="520" y1="106" x2="594" y2="106" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah-gray)"/>
    <text x="557" y="98" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6b7280" text-anchor="middle">15 s clean</text>

    <!-- eject: LIVE → EJECTED (below) -->
    <path d="M 675 128 L 675 150 L 215 150 L 215 132" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#ah-red)"/>
    <text x="445" y="167" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#991b1b" text-anchor="middle">eject: 5xx burst · stuck 45 s · scrape fail ×2</text>

    <!-- EJECTED note -->
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#6b7280">
      <text x="764" y="102">no user traffic</text>
      <text x="764" y="116">scrape continues</text>
    </g>
  </g>
</svg>
