<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" role="img" aria-label="Путь модели: скачиваем с HuggingFace (X GB) → сохраняем на диск (X GB) → загружаем в RAM (1.2X GB) → загружаем в VRAM (1–2X GB). X — размер модели; коэффициенты — сколько нужно относительно размера модели (RAM — модель + 10–20%, VRAM — веса + KV-cache)">
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">

    <!-- стрелки между стадиями -->
    <g stroke="#9ca3af" stroke-width="2" stroke-linecap="round">
      <line x1="205" y1="80" x2="222" y2="80"/>
      <line x1="423" y1="80" x2="440" y2="80"/>
      <line x1="641" y1="80" x2="658" y2="80"/>
    </g>
    <g fill="#9ca3af">
      <path d="M222 74 l8 6 l-8 6 z"/>
      <path d="M440 74 l8 6 l-8 6 z"/>
      <path d="M658 74 l8 6 l-8 6 z"/>
    </g>

    <!-- ── Стадия 1 · Скачиваем (HuggingFace) ────────────────────────── -->
    <rect x="12" y="10" width="190" height="140" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <!-- логотип HuggingFace (жёлтое лицо) -->
    <circle cx="37" cy="38" r="12" fill="#FFD43B"/>
    <circle cx="32" cy="35" r="2" fill="#111111"/>
    <circle cx="42" cy="35" r="2" fill="#111111"/>
    <path d="M31 42 Q37 47 43 42" stroke="#111111" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="57" y="43" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">СКАЧИВАЕМ</text>
    <text x="32" y="92" font-size="30" font-weight="600" letter-spacing="-0.02em" fill="#111111">X GB</text>
    <text x="32" y="118" font-size="12.5" fill="#374151">модель с HuggingFace</text>
    <text x="32" y="136" font-size="12.5" fill="#374151">safetensors · GGUF</text>

    <!-- ── Стадия 2 · Диск ───────────────────────────────────────────── -->
    <rect x="230" y="10" width="190" height="140" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="250" cy="38" r="5" fill="#8b5cf6"/>
    <text x="266" y="43" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">ДИСК</text>
    <text x="250" y="92" font-size="30" font-weight="600" letter-spacing="-0.02em" fill="#111111">X GB</text>
    <text x="250" y="118" font-size="12.5" fill="#374151">модель на диске</text>
    <text x="250" y="136" font-size="12.5" fill="#374151">NVMe 3–7 GB/s</text>

    <!-- ── Стадия 3 · RAM ────────────────────────────────────────────── -->
    <rect x="448" y="10" width="190" height="140" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="468" cy="38" r="5" fill="#3b82f6"/>
    <text x="484" y="43" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">RAM</text>
    <text x="468" y="92" font-size="30" font-weight="600" letter-spacing="-0.02em" fill="#111111">1.2X GB</text>
    <text x="468" y="118" font-size="12.5" fill="#374151">транзитный буфер</text>
    <text x="468" y="136" font-size="12.5" fill="#374151">модель + 10–20%</text>

    <!-- ── Стадия 4 · VRAM ───────────────────────────────────────────── -->
    <rect x="666" y="10" width="190" height="140" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="686" cy="38" r="5" fill="#10b981"/>
    <text x="702" y="43" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">VRAM</text>
    <text x="686" y="92" font-size="30" font-weight="600" letter-spacing="-0.02em" fill="#111111">1–2X GB</text>
    <text x="686" y="118" font-size="12.5" fill="#374151">весы + KV-cache</text>
    <text x="686" y="136" font-size="12.5" fill="#374151">PCIe Gen4 25–30 GB/s</text>

  </g>
</svg>
