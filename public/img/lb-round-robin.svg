<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" role="img" aria-label="6 запросов на 3 репликах за 12 секунд: Round Robin — длинный запрос R1 (8 с) на ноде A, следующий по кругу запрос R4 ждёт в очереди 2 с, B и C простаивают; least-loaded — те же запросы распределяются по текущей загрузке, очереди нет">
  <defs>
    <pattern id="hatch-amber" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f59e0b" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    </pattern>
  </defs>

  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">

    <!-- ── Панель A · Round Robin ─────────────────────────────────────── -->
    <rect x="8" y="6" width="864" height="144" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <text x="28" y="30" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">ROUND ROBIN — по кругу, по одному запросу на ноду</text>

    <!-- grid -->
    <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.7">
      <line x1="56" y1="40" x2="56" y2="118"/>
      <line x1="189.3" y1="40" x2="189.3" y2="118"/>
      <line x1="322.7" y1="40" x2="322.7" y2="118"/>
      <line x1="456" y1="40" x2="456" y2="118"/>
      <line x1="589.3" y1="40" x2="589.3" y2="118"/>
      <line x1="722.7" y1="40" x2="722.7" y2="118"/>
      <line x1="856" y1="40" x2="856" y2="118"/>
    </g>

    <!-- lane labels -->
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#111111">
      <text x="28" y="57">A</text>
      <text x="28" y="83">B</text>
      <text x="28" y="109">C</text>
    </g>

    <!-- R1 heavy on A: t0..8 -->
    <rect x="56" y="46" width="533.3" height="14" rx="4" fill="#ec4899"/>
    <text x="64" y="57" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R1 · 100k prefill + decode · 8 s</text>
    <!-- R2 on B: t2..3.5 -->
    <rect x="189.3" y="72" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="197" y="83" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R2</text>
    <!-- R3 on C: t4..5.5 -->
    <rect x="322.7" y="102" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="330.7" y="113" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R3</text>
    <!-- R4 queue on A: t6..8 -->
    <rect x="456" y="46" width="133.3" height="14" rx="4" fill="url(#hatch-amber)" stroke="#f59e0b" stroke-dasharray="4 3"/>
    <text x="464" y="57" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#b45309">очередь 2 s</text>
    <!-- R4 run on A: t8..9.5 -->
    <rect x="589.3" y="46" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="597.3" y="57" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R4</text>
    <!-- R5 on B: t8..9.5 -->
    <rect x="589.3" y="72" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="597.3" y="83" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R5</text>
    <!-- R6 on C: t10..11.5 -->
    <rect x="722.7" y="102" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="730.7" y="113" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R6</text>

    <!-- idle gaps -->
    <g font-size="10" font-style="italic" fill="#898989" text-anchor="middle">
      <text x="439" y="83">простой 4.5 s</text>
      <text x="572" y="113">простой 4.5 s</text>
      <text x="772" y="57">простой</text>
    </g>

    <!-- time ticks -->
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" fill="#898989" text-anchor="middle">
      <text x="56" y="131">0 s</text>
      <text x="189.3" y="131">2 s</text>
      <text x="322.7" y="131">4 s</text>
      <text x="456" y="131">6 s</text>
      <text x="589.3" y="131">8 s</text>
      <text x="722.7" y="131">10 s</text>
      <text x="856" y="131">12 s</text>
    </g>

    <!-- annotation -->
    <text x="28" y="145" font-size="12" fill="#374151">R4 по кругу приходит на A, пока A ещё декодит R1 → очередь, пока B и C простаивают</text>

    <!-- ── Панель B · Least-loaded ────────────────────────────────────── -->
    <rect x="8" y="158" width="864" height="144" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <text x="28" y="182" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">LEAST-LOADED — балансер видит текущую загрузку</text>

    <!-- grid -->
    <g stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3 3" opacity="0.7">
      <line x1="56" y1="192" x2="56" y2="270"/>
      <line x1="189.3" y1="192" x2="189.3" y2="270"/>
      <line x1="322.7" y1="192" x2="322.7" y2="270"/>
      <line x1="456" y1="192" x2="456" y2="270"/>
      <line x1="589.3" y1="192" x2="589.3" y2="270"/>
      <line x1="722.7" y1="192" x2="722.7" y2="270"/>
      <line x1="856" y1="192" x2="856" y2="270"/>
    </g>

    <!-- lane labels -->
    <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" fill="#111111">
      <text x="28" y="209">A</text>
      <text x="28" y="235">B</text>
      <text x="28" y="261">C</text>
    </g>

    <!-- R1 heavy on A: t0..8 -->
    <rect x="56" y="198" width="533.3" height="14" rx="4" fill="#ec4899"/>
    <text x="64" y="209" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R1 · 100k prefill + decode · 8 s</text>
    <!-- R2 on B: t2..3.5 -->
    <rect x="189.3" y="224" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="197" y="235" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R2</text>
    <!-- R3 on C: t4..5.5 -->
    <rect x="322.7" y="254" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="330.7" y="265" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R3</text>
    <!-- R4 on B (free): t6..7.5 -->
    <rect x="456" y="224" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="464" y="235" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R4</text>
    <!-- R5 on C (free): t8..9.5 -->
    <rect x="589.3" y="254" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="597.3" y="265" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R5</text>
    <!-- R6 on A (freed at t8): t10..11.5 -->
    <rect x="722.7" y="198" width="100" height="14" rx="4" fill="#3b82f6"/>
    <text x="730.7" y="209" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff">R6</text>

    <!-- annotation -->
    <circle cx="33" cy="293" r="4" fill="#10b981"/>
    <text x="44" y="297" font-size="12" fill="#374151">те же 6 запросов, те же длительности — без очереди: каждый запрос уходит на наименее загруженную ноду</text>
  </g>
</svg>
