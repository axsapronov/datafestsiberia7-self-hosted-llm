<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" role="img" aria-label="До: LLM-трафик без роутера. Входящий трафик неоднородный (web 50 мс, чат 10 с, агент 1 мин) и bursty. Round Robin делит по числу запросов: Реплика #1 получает большой агентский запрос — слот занят, очередь растёт; Реплика #2 получает поток коротких — KV-кэш протухает между запросами.">
  <defs>
    <pattern id="hatch-amber" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f59e0b" opacity="0.14"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    </pattern>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">

    <!-- ── Панель · до (без роутера) ──────────────────────────────────── -->
    <rect x="8" y="6" width="1144" height="474" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <text x="28" y="28" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="0.08em" fill="#6b7280">2 РЕПЛИКИ · LLM-ТРАФИК · БЕЗ РОУТЕРА</text>
    <rect x="1056" y="13" width="76" height="24" rx="12" fill="#ef4444" opacity="0.12"/>
    <text x="1094" y="29" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" font-weight="600" letter-spacing="0.08em" fill="#ef4444" text-anchor="middle">ДО</text>

    <!-- ── Входящий LLM-трафик (неоднородный + bursty) ────────────────── -->
    <text x="28" y="48" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="500" letter-spacing="0.08em" fill="#6b7280">ВХОДЯЩИЙ LLM-ТРАФИК</text>
    <g>
      <rect x="28" y="56" width="30" height="24" rx="5" fill="#d1d5db"/>
      <rect x="63" y="56" width="30" height="24" rx="5" fill="#d1d5db"/>
      <rect x="98" y="56" width="113" height="24" rx="5" fill="#3b82f6"/>
      <text x="155" y="72" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
      <rect x="216" y="56" width="268" height="24" rx="5" fill="#ec4899"/>
      <text x="350" y="72" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#ffffff" text-anchor="middle">агент · 1 мин · 100k prefill</text>
      <rect x="491" y="56" width="30" height="24" rx="5" fill="#d1d5db"/>
      <rect x="528" y="56" width="113" height="24" rx="5" fill="#3b82f6"/>
      <text x="585" y="72" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
      <rect x="645" y="56" width="30" height="24" rx="5" fill="#d1d5db"/>
      <rect x="679" y="56" width="113" height="24" rx="5" fill="#3b82f6"/>
      <text x="736" y="72" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
      <rect x="794" y="56" width="268" height="24" rx="5" fill="#ec4899"/>
      <text x="928" y="72" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#ffffff" text-anchor="middle">агент · 1 мин · 100k prefill</text>
      <rect x="1069" y="56" width="30" height="24" rx="5" fill="#d1d5db"/>
      <rect x="1104" y="56" width="30" height="24" rx="5" fill="#d1d5db"/>
    </g>
    <text x="28" y="92" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#9ca3af">размер = стоимость: 50 мс … 1 мин (×1200)</text>

    <!-- ── Round Robin (делит по числу запросов) ──────────────────────── -->
    <rect x="450" y="132" width="260" height="44" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="580" y="150" font-size="15" font-weight="600" fill="#374151" text-anchor="middle">Round Robin</text>
    <text x="580" y="166" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#6b7280" text-anchor="middle">1 → 2 → 1 → 2 … (по числу)</text>
    <line x1="510" y1="176" x2="294" y2="210" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
    <line x1="650" y1="176" x2="866" y2="210" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

    <!-- ── Реплика #1 · большой запрос, очередь ────────────────────────── -->
    <rect x="28" y="210" width="532" height="118" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="40" y="230" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#111111">Реплика #1</text>
    <rect x="40" y="238" width="420" height="20" rx="4" fill="#ec4899"/>
    <text x="250" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#ffffff" text-anchor="middle">агент · 1 мин · слот занят</text>
    <rect x="472" y="238" width="21" height="20" rx="3" fill="#d1d5db"/>
    <rect x="497" y="238" width="21" height="20" rx="3" fill="#d1d5db"/>
    <rect x="523" y="238" width="21" height="20" rx="3" fill="#d1d5db"/>
    <text x="472" y="268" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#6b7280">очередь: 3</text>
    <rect x="40" y="280" width="500" height="14" rx="3" fill="#10b981" opacity="0.5"/>
    <text x="540" y="291" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#047857" text-anchor="end">кэш живёт</text>
    <text x="40" y="316" font-size="13" fill="#ef4444">→ очередь растёт, другие реплики простаивают</text>

    <!-- ── Реплика #2 · поток коротких, кэш протухает ─────────────────── -->
    <rect x="600" y="210" width="532" height="118" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="612" y="230" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14" font-weight="600" fill="#111111">Реплика #2</text>
    <rect x="616" y="238" width="93" height="20" rx="4" fill="#3b82f6"/>
    <text x="662" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
    <rect x="717" y="238" width="93" height="20" rx="4" fill="#3b82f6"/>
    <text x="763" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
    <rect x="818" y="238" width="93" height="20" rx="4" fill="#3b82f6"/>
    <text x="864" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
    <rect x="919" y="238" width="93" height="20" rx="4" fill="#3b82f6"/>
    <text x="965" y="252" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#ffffff" text-anchor="middle">чат · 10 с</text>
    <rect x="612" y="280" width="505" height="14" rx="3" fill="url(#hatch-amber)" stroke="#f59e0b" stroke-width="1"/>
    <text x="1117" y="291" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12" fill="#b45309" text-anchor="end">кэш протухает</text>
    <text x="612" y="316" font-size="13" fill="#b45309">→ каждый запрос вытесняет чужой кэш</text>

    <!-- ── Легенда · 4 особенности ────────────────────────────────────── -->
    <circle cx="32" cy="382" r="4" fill="#ec4899"/>
    <text x="42" y="386" font-size="13" fill="#374151">неоднородные: 50 мс … 1 мин (×1200)</text>
    <circle cx="32" cy="404" r="4" fill="#3b82f6"/>
    <text x="42" y="408" font-size="13" fill="#374151">bursty: агент — 3–10 параллельно</text>
    <circle cx="600" cy="382" r="4" fill="#10b981"/>
    <text x="610" y="386" font-size="13" fill="#374151">кэш — состояние на ноде</text>
    <circle cx="600" cy="404" r="4" fill="#f59e0b"/>
    <text x="610" y="408" font-size="13" fill="#374151">стоимость ∝ токенам: слот = минуты</text>
  </g>
</svg>
