<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" role="img" aria-label="Ожидания пользователей от ИИ-инфраструктуры в 2026: скорость 80–100 ток/с (50 — разработка с агентами, 25 — чат), контекст 256k токенов (200k — Cursor, 100k — документация), объём 50M токенов/сутки на чел. (3–4 задачи в день), качество не хуже Claude 3.5 Sonnet, OpenAI/Anthropic-совместимый API, статистика и управление доступами">
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">

    <!-- ── Карточка 1 · Скорость ─────────────────────────────────────── -->
    <rect x="12" y="6" width="422" height="104" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="32" cy="28" r="5" fill="#3b82f6"/>
    <text x="48" y="33" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">СКОРОСТЬ</text>
    <text x="32" y="68" font-size="34" font-weight="600" letter-spacing="-0.02em" fill="#111111">80–100<tspan font-size="16" font-weight="500" dx="8" fill="#6b7280">ток/с</tspan></text>
    <text x="32" y="92" font-size="13" fill="#374151">50 — разработка с агентами · 25 — чат</text>

    <!-- ── Карточка 2 · Контекст ─────────────────────────────────────── -->
    <rect x="446" y="6" width="422" height="104" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="466" cy="28" r="5" fill="#8b5cf6"/>
    <text x="482" y="33" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">КОНТЕКСТ</text>
    <text x="466" y="68" font-size="34" font-weight="600" letter-spacing="-0.02em" fill="#111111">256k<tspan font-size="16" font-weight="500" dx="8" fill="#6b7280">токенов</tspan></text>
    <text x="466" y="92" font-size="13" fill="#374151">200k — оптимум для Cursor · 100k — документация</text>

    <!-- ── Карточка 3 · Объём ────────────────────────────────────────── -->
    <rect x="12" y="120" width="422" height="104" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="32" cy="142" r="5" fill="#ec4899"/>
    <text x="48" y="147" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">ОБЪЁМ</text>
    <text x="32" y="182" font-size="34" font-weight="600" letter-spacing="-0.02em" fill="#111111">50M<tspan font-size="16" font-weight="500" dx="8" fill="#6b7280">токенов/сутки на чел.</tspan></text>
    <text x="32" y="206" font-size="13" fill="#374151">3–4 задачи в день</text>

    <!-- ── Карточка 4 · Качество ─────────────────────────────────────── -->
    <rect x="446" y="120" width="422" height="104" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="466" cy="142" r="5" fill="#10b981"/>
    <text x="482" y="147" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">КАЧЕСТВО</text>
    <text x="466" y="182" font-size="34" font-weight="600" letter-spacing="-0.02em" fill="#111111">≥ Claude 3.5 Sonnet</text>
    <text x="466" y="206" font-size="13" fill="#374151">Архитектурное ревью · реализация фич целиком</text>

    <!-- ── Карточка 5 · API ──────────────────────────────────────────── -->
    <rect x="12" y="234" width="422" height="104" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="32" cy="256" r="5" fill="#f59e0b"/>
    <text x="48" y="261" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">API</text>
    <text x="32" y="296" font-size="30" font-weight="600" letter-spacing="-0.02em" fill="#111111">OpenAI / Anthropic</text>
    <text x="32" y="320" font-size="13" fill="#374151">Совместимый API — стандартные клиенты, SDK и агенты</text>

    <!-- ── Карточка 6 · Управление ───────────────────────────────────── -->
    <rect x="446" y="234" width="422" height="104" rx="14" fill="#f5f5f5" stroke="#e5e7eb"/>
    <circle cx="466" cy="256" r="5" fill="#0ea5e9"/>
    <text x="482" y="261" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.08em" fill="#6b7280">УПРАВЛЕНИЕ</text>
    <text x="466" y="296" font-size="20" font-weight="600" letter-spacing="-0.01em" fill="#111111">Статистика и управление доступами</text>
    <text x="466" y="320" font-size="13" fill="#374151">Токены и запросы по пользователям и моделям, API-ключи</text>

  </g>
</svg>
